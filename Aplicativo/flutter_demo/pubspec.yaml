name: flutter_demo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_speed_dial: ^7.0.0
  http: ^0.13.6
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/Cyberpunk.png
    - assets/images/Elden_Ring.png
    - assets/images/God_Of_War.png
    - assets/images/Hollow_Knight.png
    - assets/images/Red_Dead.png
    - assets/images/TW3.png
